// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    // AGP 8.5.2 es compatible con JDK 17/21
    id 'com.android.application' version '8.5.2' apply false
    id 'com.android.library' version '8.5.2' apply false
    // Plugin de Google Services: se declara aquí (apply false) para que su
    // classpath quede resuelto, pero SOLO se aplica en app/build.gradle si el
    // archivo app/google-services.json existe. Así el proyecto compila tanto
    // con credenciales Firebase como sin ellas.
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
