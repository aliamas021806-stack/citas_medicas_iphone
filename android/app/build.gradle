plugins {
    id 'com.android.application'
}

// El plugin de Google Services solo se APLICA si existe google-services.json.
// De este modo el proyecto COMPILA siempre (con y sin credenciales Firebase).
// El plugin ya queda en el classpath (declarado en el build.gradle raíz).
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// -----------------------------------------------------------------------------
// Configuracion de firma.
// Lee key.properties (raiz del proyecto). Si no existe, cae de vuelta a la
// keystore de debug para que la compilacion NUNCA falle.
// -----------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasReleaseSigning = keystoreProperties['storeFile'] != null
}

android {
    namespace 'com.tuempresa.citasmedicas'
    compileSdk 34

    defaultConfig {
        applicationId "com.tuempresa.citasmedicas"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
            // Habilita los TRES esquemas de firma para maxima compatibilidad de
            // instalacion (v1 JAR + v2 + v3). Sin v1, algunos instaladores y
            // navegadores rechazan el APK con "Aplicacion no instalada".
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Firmamos el RELEASE con la keystore de release propia (instalable y
            // estable entre builds). Si no se encontro key.properties, usamos la
            // keystore de debug para no romper la compilacion en CI.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // El plugin de AGP 8.x genera APKs con zipalign/APK Signature Scheme v2/v3.
    // La firma v1 tambien se habilita por compatibilidad con Android < 7.
    buildFeatures {
        viewBinding true
    }

    // Compatible con JDK 21: compilamos bytecode para Java 17 (soportado por Android)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    // AndroidX core / lifecycle (MVVM)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Lifecycle (ViewModel + LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'

    // Room (persistencia local de citas)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Retrofit + Gson (capa de red simulada con MockInterceptor)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // ------------------------------------------------------------------
    // FIREBASE (Firestore) - versiones ESTABLES y compatibles con AGP 8.5.2
    // Se gestionan con el BOM para asegurar coherencia entre artefactos.
    // Notas de optimización de costos:
    //  * firebase-firestore: consultas con limit()/get() y un único batch de
    //    siembra idempotente (ver FirestoreSeeder.java).
    //  * firebase-auth: login REAL (email/password) sustituye el login simulado.
    // ------------------------------------------------------------------
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
